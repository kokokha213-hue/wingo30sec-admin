<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINGO 30 SEC DEMO — Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #0d1117;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(56, 189, 248, 0.15);
            --neon-cyan: #38bdf8;
            --neon-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #38bdf8, #3b82f6, #6366f1);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .grid-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .card-header i { color: var(--neon-cyan); }

        .key-display {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .key-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .key-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--neon-cyan);
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .status-badge.disabled {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .input-field {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Roboto Mono', monospace;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            width: 100%;
            margin-top: 8px;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.5);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-generate {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a78bfa;
        }

        .btn-enable {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.82rem;
        }

        .btn-disable {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--warning);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.82rem;
        }

        .message {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .message.show { display: block; }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        .message.info {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--neon-cyan);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            .card { padding: 20px 16px; }
            .input-group { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">⚙️ ADMIN DASHBOARD</h1>
            <span class="admin-badge">🔒 ADMIN PANEL</span>
        </div>

        <!-- Access Key Card -->
        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-key"></i> ACCESS KEY MANAGEMENT
            </div>

            <div class="key-display">
                <div>
                    <div class="key-label">Current Access Key</div>
                    <div class="key-value" id="currentKeyDisplay">Loading...</div>
                </div>
                <div>
                    <span class="status-badge active" id="keyStatusBadge">ACTIVE</span>
                </div>
            </div>

            <div class="card-header" style="font-size: 0.95rem;">
                <i class="fa-solid fa-pen-to-square"></i> CHANGE ACCESS KEY
            </div>

            <div class="input-group">
                <input type="text" class="input-field" id="newAccessKey" placeholder="Enter new access key">
                <button class="btn btn-generate" id="generateKeyBtn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> GENERATE
                </button>
            </div>

            <div class="btn-group" style="margin-bottom: 12px;">
                <button class="btn btn-enable" id="enableKeyBtn">
                    <i class="fa-solid fa-toggle-on"></i> ENABLE
                </button>
                <button class="btn btn-disable" id="disableKeyBtn">
                    <i class="fa-solid fa-toggle-off"></i> DISABLE
                </button>
            </div>

            <button class="btn btn-primary" id="saveChangesBtn">
                <i class="fa-solid fa-floppy-disk"></i> SAVE CHANGES
            </button>

            <div class="message" id="message"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCXGBzzWa3J0xpXl13BO42jsrKd-UA-yqs",
            authDomain: "wingohack-20abf.firebaseapp.com",
            projectId: "wingohack-20abf",
            storageBucket: "wingohack-20abf.firebasestorage.app",
            messagingSenderId: "900242640346",
            appId: "1:900242640346:web:fba860a8ea16df945f84e3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const accessControlRef = db.collection('settings').doc('accessControl');

        console.log('✅ Firebase connected');

        // DOM Elements
        const currentKeyDisplay = document.getElementById('currentKeyDisplay');
        const keyStatusBadge = document.getElementById('keyStatusBadge');
        const newAccessKey = document.getElementById('newAccessKey');
        const generateKeyBtn = document.getElementById('generateKeyBtn');
        const enableKeyBtn = document.getElementById('enableKeyBtn');
        const disableKeyBtn = document.getElementById('disableKeyBtn');
        const saveChangesBtn = document.getElementById('saveChangesBtn');
        const message = document.getElementById('message');

        let pendingChanges = {};

        // Show message
        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message show ' + type;
            setTimeout(() => { message.className = 'message'; }, 4000);
        }

        // Load current data
        async function loadData() {
            try {
                const doc = await accessControlRef.get();
                if (doc.exists) {
                    const data = doc.data();
                    currentKeyDisplay.textContent = data.accessKey || 'NOT SET';
                    
                    if (data.enabled !== false) {
                        keyStatusBadge.textContent = 'ACTIVE';
                        keyStatusBadge.className = 'status-badge active';
                    } else {
                        keyStatusBadge.textContent = 'DISABLED';
                        keyStatusBadge.className = 'status-badge disabled';
                    }
                } else {
                    currentKeyDisplay.textContent = 'NOT CONFIGURED';
                    showMessage('Firestore document not found! Create settings/accessControl first.', 'error');
                }
            } catch (error) {
                console.error('Load error:', error);
                currentKeyDisplay.textContent = 'ERROR LOADING';
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Real-time listener
        accessControlRef.onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                currentKeyDisplay.textContent = data.accessKey || 'NOT SET';
                if (data.enabled !== false) {
                    keyStatusBadge.textContent = 'ACTIVE';
                    keyStatusBadge.className = 'status-badge active';
                } else {
                    keyStatusBadge.textContent = 'DISABLED';
                    keyStatusBadge.className = 'status-badge disabled';
                }
            }
        });

        // Generate key
        generateKeyBtn.addEventListener('click', () => {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let key = 'WINGO-';
            for (let i = 0; i < 16; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            newAccessKey.value = key;
            showMessage('New key generated! Click Save Changes to apply.', 'info');
        });

        // Enable
        enableKeyBtn.addEventListener('click', () => {
            pendingChanges.enabled = true;
            keyStatusBadge.textContent = 'ACTIVE';
            keyStatusBadge.className = 'status-badge active';
            showMessage('Key will be ENABLED after saving.', 'info');
        });

        // Disable
        disableKeyBtn.addEventListener('click', () => {
            pendingChanges.enabled = false;
            keyStatusBadge.textContent = 'DISABLED';
            keyStatusBadge.className = 'status-badge disabled';
            showMessage('Key will be DISABLED after saving.', 'info');
        });

        // Track input
        newAccessKey.addEventListener('input', () => {
            if (newAccessKey.value.trim()) {
                pendingChanges.accessKey = newAccessKey.value.trim();
            }
        });

        // Save
        saveChangesBtn.addEventListener('click', async () => {
            const newKey = newAccessKey.value.trim();
            if (newKey) pendingChanges.accessKey = newKey;

            if (!pendingChanges.accessKey && pendingChanges.enabled === undefined) {
                showMessage('No changes to save.', 'info');
                return;
            }

            if (pendingChanges.accessKey) {
                const confirmChange = confirm('Are you sure you want to change the Access Key? All users will need the new key.');
                if (!confirmChange) return;
            }

            saveChangesBtn.disabled = true;
            saveChangesBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> SAVING...';

            try {
                const updateData = {
                    updatedAt: new Date().toISOString()
                };

                if (pendingChanges.accessKey) {
                    updateData.accessKey = pendingChanges.accessKey;
                }
                if (pendingChanges.enabled !== undefined) {
                    updateData.enabled = pendingChanges.enabled;
                }

                await accessControlRef.update(updateData);

                pendingChanges = {};
                newAccessKey.value = '';
                showMessage('✅ Changes saved successfully!', 'success');

            } catch (error) {
                console.error('Save error:', error);
                
                // If document doesn't exist, create it
                if (error.code === 'not-found') {
                    try {
                        const createData = {
                            accessKey: pendingChanges.accessKey || 'WINGO-DEMO-2024',
                            enabled: pendingChanges.enabled !== undefined ? pendingChanges.enabled : true,
                            updatedAt: new Date().toISOString()
                        };
                        await accessControlRef.set(createData);
                        pendingChanges = {};
                        newAccessKey.value = '';
                        showMessage('✅ Document created and saved!', 'success');
                    } catch (createError) {
                        showMessage('❌ Error: ' + createError.message, 'error');
                    }
                } else {
                    showMessage('❌ Error: ' + error.message, 'error');
                }
            } finally {
                saveChangesBtn.disabled = false;
                saveChangesBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> SAVE CHANGES';
            }
        });

        // Load data on start
        loadData();
        console.log('🚀 Admin Panel Ready');
    </script>
</body>
</html>
